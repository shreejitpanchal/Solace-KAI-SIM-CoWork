# Whole simulation in containers: provision (one-shot: access control, queues
# with a 24 h message TTL and their DMQs, over SEMP), publisher (one task every
# PUBLISH_INTERVAL_SECONDS), the five consuming services, and optionally the
# broker itself.
#
# Access control: every service connects as its own client username
# (cowork-<service>, fixed by the registry in src/kai_sim_cowork/services/) and is handed only
# its own password, as SOLACE_PASSWORD, from SOLACE_PASSWORD_<SERVICE> in .env.
# Only the provisioner sees all six, to create the usernames. .env must set
# them; there is no default, so a missing one stops compose with its name.
#
# Broker, two modes, chosen in .env:
#   local     COMPOSE_PROFILES=local-broker (the default in .env.example): the
#             `solace` service runs here and the apps reach it as tcp://solace:55555.
#   external  COMPOSE_PROFILES= (empty) and SOLACE_HOST/VPN plus SEMP_URL and
#             an admin in SEMP_USERNAME/PASSWORD for the external broker.
#             Nothing broker-related starts here.
#             For a broker on this machine, use tcp://host.docker.internal:55555.
#
#   docker compose up -d --build             everything (+ broker in local mode)
#   docker compose logs -f publisher orchestrator agent-runtime tool-execution streaming-gateway audit-pipeline
#   docker compose down
#
# One-off bursts alongside the running publisher:
#   PUBLISH_COUNT=3 docker compose run --rm publisher
#
# The apps do not depends_on the broker (it may not be in this file's scope);
# Broker.connect retries for up to three minutes instead, which also covers
# the local container's 1-2 minute boot.

# Shared environment, with no credentials in it: each service adds its own
# SOLACE_PASSWORD and the provision service adds the SEMP settings.
x-env: &env
  SOLACE_HOST: ${SOLACE_HOST:-tcp://solace:55555}
  SOLACE_VPN: ${SOLACE_VPN:-default}
  SOLACE_QUEUE_PREFIX: ${SOLACE_QUEUE_PREFIX:-q.cowork}
  SOLACE_CREATE_QUEUES: ${SOLACE_CREATE_QUEUES:-false}
  COWORK_ENVIRONMENT: ${COWORK_ENVIRONMENT:-dev}
  COWORK_REGION: ${COWORK_REGION:-apse1}
  COWORK_TENANT_ID: ${COWORK_TENANT_ID:-acme}
  PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-5}
  PUBLISH_COUNT: ${PUBLISH_COUNT:-0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: kai-sim-cowork:dev
  environment: *env
  extra_hosts:
    - "host.docker.internal:host-gateway" # lets Linux hosts reach a broker on the host machine

# One consuming service. Each service below runs its own entry point
# (kai-sim-<service>, the main.py of its package under src/kai_sim_cowork/services/)
# and binds <prefix>.<env>.<region>.<service>, whose subscriptions its package declares.
x-consumer: &consumer
  <<: *app
  depends_on:
    provision: { condition: service_completed_successfully }
  restart: on-failure

services:
  # Local broker; only with the local-broker profile. PubSub+ Standard
  # single node, pulled from Docker Hub on first `up`. Spool state lives in
  # the named volume below and survives `down`; `down -v` wipes it.
  solace:
    image: ${SOLACE_IMAGE:-solace/solace-pubsub-standard:10.26.0.9219}
    container_name: solace-std
    profiles: ["local-broker"]
    volumes:
      - "solace-std-storage-group:/var/lib/solace"
    shm_size: 1g
    ulimits:
      core: -1
      nofile:
        soft: 2448
        hard: 1048576
    ports:
      - "8008:8008"   # Web transport
      - "1443:1443"   # Web transport over TLS
      - "1943:1943"   # SEMP over TLS
      - "1883:1883"   # MQTT default VPN
      - "5671:5671"   # AMQP default VPN over TLS
      - "5672:5672"   # AMQP default VPN
      - "8000:8000"   # MQTT default VPN over WebSockets
      - "8443:8443"   # MQTT default VPN over WebSockets / TLS
      - "8883:8883"   # MQTT default VPN over TLS
      - "8080:8080"   # SEMP / PubSub+ Manager
      - "9000:9000"   # REST default VPN
      - "9443:9443"   # REST default VPN over TLS
      - "55555:55555" # SMF (what the Python API connects to)
      - "55003:55003" # SMF compressed
      - "55443:55443" # SMF over TLS
      - "2222:2222"   # SSH to the CLI
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${SOLACE_ADMIN_PASSWORD:-admin}
      - system_scaling_maxconnectioncount=100
      - system_scaling_maxqueuemessagecount=240
      - system_scaling_maxkafkabridgecount=0
      - system_scaling_maxkafkabrokerconnectioncount=0
      - system_scaling_maxbridgecount=25
      - system_scaling_maxsubscriptioncount=500000
      - system_scaling_maxguaranteedmessagesize=10
      - messagespool_maxspoolusage=50000
      - TZ=${TZ:-Asia/Singapore}
    healthcheck:
      # 200 once the message spool is active; the broker takes 1-2 minutes to boot.
      test: ["CMD-SHELL", "curl -sf http://localhost:5550/health-check/guaranteed-active || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # One-shot: over SEMP v2 it creates the client profiles, one ACL profile and
  # client username per service, then every service queue with its owner,
  # subscriptions, a 24-hour message TTL (QUEUE_MAX_TTL_SECONDS), a redelivery
  # limit (QUEUE_MAX_REDELIVERY_COUNT) and its dead message queue, then exits
  # 0. The publisher and every consumer wait for it, so nothing connects
  # before its username and queue exist. It retries SEMP for
  # PROVISION_TIMEOUT_SECONDS to cover the broker's boot. It is the only
  # container that holds the SEMP admin password and all six service passwords.
  provision:
    <<: *app
    container_name: kai-sim-provision
    entrypoint: ["kai-sim-provision"]
    environment:
      <<: *env
      SEMP_URL: ${SEMP_URL:-http://solace:8080}
      SEMP_USERNAME: ${SEMP_USERNAME:-admin}
      SEMP_PASSWORD: ${SEMP_PASSWORD:-${SOLACE_ADMIN_PASSWORD:-admin}}
      QUEUE_MAX_TTL_SECONDS: ${QUEUE_MAX_TTL_SECONDS:-86400}
      QUEUE_MAX_REDELIVERY_COUNT: ${QUEUE_MAX_REDELIVERY_COUNT:-3}
      PROVISION_TIMEOUT_SECONDS: ${PROVISION_TIMEOUT_SECONDS:-180}
      SOLACE_PASSWORD_API_GATEWAY: ${SOLACE_PASSWORD_API_GATEWAY:?set it in .env (see .env.example)}
      SOLACE_PASSWORD_ORCHESTRATOR: ${SOLACE_PASSWORD_ORCHESTRATOR:?set it in .env (see .env.example)}
      SOLACE_PASSWORD_AGENT_RUNTIME: ${SOLACE_PASSWORD_AGENT_RUNTIME:?set it in .env (see .env.example)}
      SOLACE_PASSWORD_TOOL_EXECUTION: ${SOLACE_PASSWORD_TOOL_EXECUTION:?set it in .env (see .env.example)}
      SOLACE_PASSWORD_STREAMING_GATEWAY: ${SOLACE_PASSWORD_STREAMING_GATEWAY:?set it in .env (see .env.example)}
      SOLACE_PASSWORD_AUDIT_PIPELINE: ${SOLACE_PASSWORD_AUDIT_PIPELINE:?set it in .env (see .env.example)}

  # Simulated API gateway: one task.created every PUBLISH_INTERVAL_SECONDS.
  # PUBLISH_COUNT > 0 publishes that many and exits (useful with `compose run`).
  # Connects as cowork-api-gateway: may publish task.created, owns no queue.
  publisher:
    <<: *app
    container_name: kai-sim-publisher
    entrypoint: ["kai-sim-publisher"]
    environment:
      <<: *env
      SOLACE_PASSWORD: ${SOLACE_PASSWORD_API_GATEWAY:?set it in .env (see .env.example)}
    depends_on:
      provision: { condition: service_completed_successfully }
    restart: on-failure

  # The five consuming services: one container, one client username
  # (cowork-<service>) and one queue each.
  orchestrator:
    <<: *consumer
    container_name: kai-sim-orchestrator
    entrypoint: ["kai-sim-orchestrator"]
    environment:
      <<: *env
      SOLACE_PASSWORD: ${SOLACE_PASSWORD_ORCHESTRATOR:?set it in .env (see .env.example)}

  agent-runtime:
    <<: *consumer
    container_name: kai-sim-agent-runtime
    entrypoint: ["kai-sim-agent-runtime"]
    environment:
      <<: *env
      SOLACE_PASSWORD: ${SOLACE_PASSWORD_AGENT_RUNTIME:?set it in .env (see .env.example)}

  tool-execution:
    <<: *consumer
    container_name: kai-sim-tool-execution
    entrypoint: ["kai-sim-tool-execution"]
    environment:
      <<: *env
      SOLACE_PASSWORD: ${SOLACE_PASSWORD_TOOL_EXECUTION:?set it in .env (see .env.example)}

  streaming-gateway:
    <<: *consumer
    container_name: kai-sim-streaming-gateway
    entrypoint: ["kai-sim-streaming-gateway"]
    environment:
      <<: *env
      SOLACE_PASSWORD: ${SOLACE_PASSWORD_STREAMING_GATEWAY:?set it in .env (see .env.example)}

  audit-pipeline:
    <<: *consumer
    container_name: kai-sim-audit-pipeline
    entrypoint: ["kai-sim-audit-pipeline"]
    environment:
      <<: *env
      SOLACE_PASSWORD: ${SOLACE_PASSWORD_AUDIT_PIPELINE:?set it in .env (see .env.example)}

volumes:
  solace-std-storage-group:
